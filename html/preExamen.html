<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-vendedores {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        .card { border-radius: 4px; }
        .form-label { font-weight: 500; margin-bottom: 5px; }
        .pError{
            color: red;
        }
    </style>
</head>
<body>

    <header class="header-vendedores">
        <h1 class="fw-bold">Vendedores</h1>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="inputId" class="form-label">ID</label>
                            <input type="number" class="form-control" id="inputId" value="1">
                        </div>
                        <button class="btn btn-primary px-4" id="btnMostrar">Mostrar</button>
                    </div>
                </div>
                <p class="pError" id="pEror"></p>

                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="resName" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre Usuario</label>
                            <input type="text" class="form-control" id="resUsername" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="text" class="form-control" id="resEmail" readonly>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Domicilio</label>
                            <input type="text" class="form-control mb-2" id="resStreet" readonly>
                            <input type="text" class="form-control mb-2" id="resZip" readonly>
                            <input type="text" class="form-control" id="resCity" readonly>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="../js/preExamen.js"></script>
</body>
</html>
