<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog API Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dog-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .img-placeholder {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="dog-container border text-center">
        
        <div class="row g-2 mb-4">
            <div class="col-sm-6">
                <select class="form-select" id="dogSelector">
                    <option selected disabled>Selecciona el Perro</option>
                    </select>
            </div>
            <div class="col-sm-3">
                <button class="btn btn-secondary w-100" id="btnVer">Ver Imagen</button>
            </div>
            <div class="col-sm-3">
                <button class="btn btn-secondary w-100" id="btnLimpiar">Limpiar</button>
            </div>
        </div>

        <div class="img-placeholder bg-white border p-3">
            <img id="dogImage" 
                 src="https://dog.ceo/img/dog-api-logo.svg" 
                 alt="Dog API Logo" 
                 class="img-fluid" 
                 style="max-height: 400px;">
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/leer.js"></script>
</body>
</html>
