<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 02 - Servicios Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            margin-top: 20px;
        }
        h1 {
            color: #667eea;
            font-weight: bold;
        }
        h2 {
            color: #764ba2;
            font-size: 1.2rem;
        }
        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .table tbody tr:hover {
            background-color: #f8f9fa;
        }
        .alert-error {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        <h1 class="text-center mb-2">Práctica 02</h1>
        <h2 class="text-center mb-4">Servicios Web</h2>
        
        <div id="pEror" class="alert alert-danger alert-error" role="alert">
            <!-- mensaje de error -->
        </div>

        <div class="table-responsive">
            <table class="table table-hover" id="tabla">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Completado</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!-- tabla dinámica -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/tablaPractica02.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
