<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Lista de Alumnos</h1>
        
        <div class="card p-4 mb-4">
            <h5 class="card-title">Agregar Estudiante</h5>
            <div class="row g-3">
                <div class="col-md-2">
                    <input type="text" id="txtId" class="form-control" placeholder="ID">
                </div>
                <div class="col-md-4">
                    <input type="text" id="txtNombre" class="form-control" placeholder="Nombre">
                </div>
                <div class="col-md-4">
                    <input type="text" id="txtEscuela" class="form-control" placeholder="Escuela">
                </div>
                <div class="col-md-2">
                    <button id="btnAgregar" class="btn btn-primary w-100">Agregar</button>
                </div>
            </div>
        </div>
            <p id="pEror" style="color: red; text-align: center;" >
                <!-- mensaje de error -->
            </p>
        <table class="table table-striped table-hover" id="tabla">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Escuela</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <!-- tabla dinámica -->
            </tbody>
        </table>
    </div>

    <script src="../js/tabla.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
