<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TheCocktailDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .hero-section {
            background: linear-gradient(135deg, #4b800b 0%, #56ab2f 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 30px;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .table-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .img-cocktail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #56ab2f;
        }
    </style>
</head>
<body>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Welcome to TheCocktailDB</h1>
            <p class="lead">API</p>
        </div>
    </header>

    <main class="container">
        <section class="table-container">
            <div id="pEror" class="text-danger fw-bold text-center mb-3"></div>
        
            <div class="row mb-4 justify-content-center">
                <div class="col-md-8">
                    <div class="input-group custom-controls">
                        <select id="cbBebidas" class="form-select border-success">
                            <option value="noAlc">No Alcohólicas</option>
                            <option value="alc">Alcohólicas</option>
                            <option value="todos">Todas las bebidas</option>
                        </select>
                        <button id="btnAplicar" class="btn btn-success px-4 fw-bold">
                            Aplicar Filtro
                        </button>
                    </div>
                    <div class="text-end mt-2">
                        <span id="total" class="badge bg-secondary rounded-pill shadow-sm">Total: 0</span>
                    </div>
                </div>
            </div>
        
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tabla">
                    <thead class="table-success">
                        <tr>
                            <th scope="col" class="py-3">ID</th>
                            <th scope="col" class="py-3">NOMBRE</th>
                            <th scope="col" class="py-3 text-center">VISTA PREVIA</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="text-center mt-5 pb-4 text-muted">
        <small>&copy; 2026 Refreshing Drinks Project</small>
    </footer>

    <script src="../js/bebidas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
